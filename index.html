<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartComanda - Padaria & Confeitaria Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-10" x-data="clienteApp()">

    <!-- Header / Navbar -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-bread-slice text-amber-500 text-xl"></i>
                <span class="font-black text-lg bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">SmartComanda</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full text-xs font-bold" x-text="`Comanda #${comandaId}`"></span>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">

        <!-- Status do Pedido / Resumo -->
        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <span class="text-xs font-medium text-slate-400">Status da Comanda</span>
                <span class="px-2.5 py-1 rounded-full text-xs font-bold"
                      :class="pedidoFinalizado ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'"
                      x-text="pedidoFinalizado ? 'Finalizada / Aguardando Pagamento' : 'Em Aberto'"></span>
            </div>

            <!-- Total -->
            <div class="flex justify-between items-baseline pt-1">
                <span class="text-sm font-semibold text-slate-300">Total Acumulado:</span>
                <span class="text-2xl font-black text-emerald-400 font-mono" x-text="`R$ ${calcularTotal().toFixed(2)}`"></span>
            </div>
        </div>

        <!-- BOTÃO FINALIZAR PEDIDO (Acima do campo AVALIE SUA EXPERIENCIA) -->
        <div class="space-y-3" x-show="!pedidoFinalizado">
            <button @click="finalizarEGerarQRCode()" 
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center space-x-2 transition-all transform active:scale-95 text-sm uppercase tracking-wide">
                <i class="fa-solid fa-qrcode text-lg"></i>
                <span>Finalizar e Gerar QR Code</span>
            </button>
        </div>

        <!-- Área do QR Code Modal/Card ao Finalizar -->
        <div x-show="pedidoFinalizado" class="bg-slate-900 p-4 rounded-2xl border border-emerald-500/30 space-y-3 text-center animate-fade-in">
            <p class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Comanda Finalizada com Sucesso!</p>
            <p class="text-xs text-slate-400">Apresente este QR Code no caixa para realizar o pagamento.</p>
            <div class="flex justify-center py-2">
                <canvas id="qrcode-canvas" class="p-2 bg-white rounded-xl shadow-md"></canvas>
            </div>
        </div>

        <!-- AVALIE SUA EXPERIÊNCIA -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4 text-xs shadow-xl">
            <div class="text-center space-y-1">
                <p class="font-bold text-amber-400 flex items-center justify-center space-x-1.5 text-sm">
                    <i class="fa-solid fa-star"></i>
                    <span>AVALIE SUA EXPERIÊNCIA</span>
                </p>
                <p class="text-slate-400 text-[11px]" x-text="jaAvaliou ? 'Você já enviou sua avaliação para esta comanda.' : 'Sua opinião é muito importante para nós!'"></p>
            </div>

            <!-- Caso ainda NÃO tenha avaliado -->
            <template x-if="!jaAvaliou">
                <div class="space-y-3">
                    <!-- Qualidade do Atendimento -->
                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-300 font-semibold">Qualidade do Atendimento:</span>
                            <span class="text-amber-400 font-bold font-mono" x-text="`${ratingService} / 5`"></span>
                        </div>
                        <div class="flex justify-center space-x-2 pt-1">
                            <template x-for="star in [1,2,3,4,5]" :key="'srv-'+star">
                                <button @click="ratingService = star" class="text-2xl focus:outline-none transition-transform hover:scale-125">
                                    <i class="fa-star" :class="star <= ratingService ? 'fa-solid text-amber-400' : 'fa-regular text-slate-700'"></i>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Qualidade dos Produtos -->
                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-300 font-semibold">Qualidade dos Produtos:</span>
                            <span class="text-amber-400 font-bold font-mono" x-text="`${ratingFood} / 5`"></span>
                        </div>
                        <div class="flex justify-center space-x-2 pt-1">
                            <template x-for="star in [1,2,3,4,5]" :key="'food-'+star">
                                <button @click="ratingFood = star" class="text-2xl focus:outline-none transition-transform hover:scale-125">
                                    <i class="fa-star" :class="star <= ratingFood ? 'fa-solid text-amber-400' : 'fa-regular text-slate-700'"></i>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Comentário -->
                    <div>
                        <input type="text" x-model="feedbackComment" placeholder="Deixe um comentário ou sugestão (opcional)..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>

                    <!-- Botão Enviar Avaliação -->
                    <button @click="enviarAvaliacao()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-xl font-bold transition-all shadow">
                        Enviar Avaliação
                    </button>
                </div>
            </template>

            <!-- Caso JÁ tenha avaliado -->
            <template x-if="jaAvaliou">
                <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-3 rounded-xl text-center space-y-1">
                    <i class="fa-solid fa-circle-check text-xl"></i>
                    <p class="font-bold">Obrigado pela sua avaliação!</p>
                    <p class="text-[11px] text-emerald-300/80">Sua resposta foi registrada e guardada no backup local.</p>
                </div>
            </template>
        </div>

    </main>

    <script>
        function clienteApp() {
            return {
                comandaId: '102',
                itens: [
                    { id: 1, name: 'Pão na Chapa com Requeijão', qty: 2, price: 6.50, status: 'Pronto' },
                    { id: 2, name: 'Café Expresso Duplo', qty: 1, price: 5.00, status: 'Pronto' },
                    { id: 3, name: 'Suco de Laranja 300ml', qty: 1, price: 8.00, status: 'Em Preparo' }
                ],
                ratingService: 5,
                ratingFood: 5,
                feedbackComment: '',
                pedidoFinalizado: false,
                jaAvaliou: false,
                channel: null,

                init() {
                    // Inicializa o canal de comunicação em tempo real entre abas/janelas (Celular <-> PC)
                    this.channel = new BroadcastChannel('smartcomanda_sync_channel');
                    
                    this.channel.onmessage = (event) => {
                        if (event.data && event.data.type === 'FINALIZAR_PEDIDO' && event.data.comandaId === this.comandaId) {
                            this.aplicarFinalizacao();
                        }
                    };

                    // Escuta alterações do backup via localStorage
                    window.addEventListener('storage', (e) => {
                        if (e.key === `smartcomanda_status_${this.comandaId}`) {
                            this.carregarBackup();
                        }
                    });

                    // Carrega backup ao inicializar a página
                    this.carregarBackup();
                },

                calcularTotal() {
                    return this.itens.reduce((acc, i) => acc + (i.qty * i.price), 0);
                },

                finalizarEGerarQRCode() {
                    this.aplicarFinalizacao();

                    // Notifica o PC / Outras telas conectadas à comanda
                    if (this.channel) {
                        this.channel.postMessage({
                            type: 'FINALIZAR_PEDIDO',
                            comandaId: this.comandaId,
                            total: this.calcularTotal(),
                            timestamp: new Date().getTime()
                        });
                    }

                    // Salva estado no backup
                    this.salvarBackup();
                },

                aplicarFinalizacao() {
                    this.pedidoFinalizado = true;
                    this.$nextTick(() => {
                        this.gerarQRCodeCanvas();
                    });
                },

                gerarQRCodeCanvas() {
                    const canvas = document.getElementById('qrcode-canvas');
                    if (canvas && window.QRCode) {
                        const dadosQRCode = JSON.stringify({
                            comanda: this.comandaId,
                            total: this.calcularTotal(),
                            data: new Date().toISOString()
                        });
                        QRCode.toCanvas(canvas, dadosQRCode, { width: 160 }, function (error) {
                            if (error) console.error(error);
                        });
                    }
                },

                enviarAvaliacao() {
                    if (this.jaAvaliou) {
                        alert('Você já realizou uma avaliação para esta comanda.');
                        return;
                    }

                    this.jaAvaliou = true;
                    this.salvarBackup();
                    
                    // Notifica a central sobre a nova avaliação
                    if (this.channel) {
                        this.channel.postMessage({
                            type: 'NOVA_AVALIACAO',
                            comandaId: this.comandaId,
                            atendimento: this.ratingService,
                            produtos: this.ratingFood,
                            comentario: this.feedbackComment
                        });
                    }

                    alert('Avaliação enviada com sucesso! Muito obrigado.');
                },

                // --- SISTEMA DE BACKUP AUTOMÁTICO ---
                salvarBackup() {
                    const dadosComanda = {
                        comandaId: this.comandaId,
                        pedidoFinalizado: this.pedidoFinalizado,
                        jaAvaliou: this.jaAvaliou,
                        ratingService: this.ratingService,
                        ratingFood: this.ratingFood,
                        feedbackComment: this.feedbackComment,
                        ultimaAtualizacao: new Date().toISOString()
                    };

                    localStorage.setItem(`smartcomanda_status_${this.comandaId}`, JSON.stringify(dadosComanda));
                    
                    // Backup geral do sistema (histórico)
                    const historico = JSON.parse(localStorage.getItem('smartcomanda_historico_backups') || '[]');
                    historico.push(dadosComanda);
                    localStorage.setItem('smartcomanda_historico_backups', JSON.stringify(historico));
                },

                carregarBackup() {
                    const dadosSalvos = localStorage.getItem(`smartcomanda_status_${this.comandaId}`);
                    if (dadosSalvos) {
                        try {
                            const backup = JSON.parse(dadosSalvos);
                            this.pedidoFinalizado = backup.pedidoFinalizado || false;
                            this.jaAvaliou = backup.jaAvaliou || false;
                            if (backup.ratingService) this.ratingService = backup.ratingService;
                            if (backup.ratingFood) this.ratingFood = backup.ratingFood;
                            if (backup.feedbackComment) this.feedbackComment = backup.feedbackComment;

                            if (this.pedidoFinalizado) {
                                this.$nextTick(() => this.gerarQRCodeCanvas());
                            }
                        } catch (e) {
                            console.error('Erro ao carregar backup local:', e);
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
