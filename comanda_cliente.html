<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartComanda - Comanda Digital da Mesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4" x-data="clienteApp()" x-init="init()">

    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col space-y-5">
        <!-- Cabeçalho -->
        <div class="flex justify-between items-center pb-4 border-b border-slate-700">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 text-slate-950 p-2 rounded-xl font-bold text-lg flex items-center justify-center w-9 h-9 shadow">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h3 class="font-bold text-base text-white">SmartComanda Digital</h3>
                    <p class="text-xs text-emerald-400 font-bold" x-text="`Mesa ${tableNumber}`"></p>
                </div>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full font-bold flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Tempo Real</span>
            </span>
        </div>

        <!-- Info do Cliente e Tempo -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 space-y-2 text-xs">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Cliente Responsável:</span>
                <strong class="text-white font-bold text-sm" x-text="clientName || 'Aguardando identificação...'"></strong>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Tempo na Mesa:</span>
                <strong class="text-indigo-400 font-mono font-bold" x-text="satTime"></strong>
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                <span class="text-slate-400 font-bold">Total Atual da Conta:</span>
                <strong class="text-emerald-400 font-bold text-base" x-text="`R$ ${total.toFixed(2)}`"></strong>
            </div>
        </div>

        <!-- Lista de Itens Consumidos -->
        <div class="space-y-2">
            <h4 class="text-xs font-bold text-slate-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-list-check text-indigo-400"></i>
                <span>Itens Lançados na Comanda:</span>
            </h4>
            <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 max-h-52 overflow-y-auto space-y-2 text-xs">
                <template x-if="items.length === 0">
                    <p class="text-slate-500 text-center py-4 italic">Nenhum item lançado na mesa ainda.</p>
                </template>
                <template x-for="item in items" :key="item.id || item.name">
                    <div class="flex justify-between items-center py-1.5 border-b border-slate-900 last:border-0">
                        <div>
                            <span class="font-medium text-white" x-text="`${item.qty}x ${item.name}`"></span>
                            <span class="text-[10px] block px-1.5 py-0.5 rounded font-bold w-fit mt-0.5"
                                  :class="{
                                      'bg-amber-500/10 text-amber-400': item.status === 'Pendente',
                                      'bg-blue-500/10 text-blue-400': item.status === 'Em Preparo',
                                      'bg-emerald-500/20 text-emerald-400': item.status === 'Pronto'
                                  }" x-text="item.status || 'Pendente'"></span>
                        </div>
                        <span class="text-emerald-400 font-bold font-mono" x-text="`R$ ${(item.qty * item.price).toFixed(2)}`"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Avaliação da Experiência -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/80 space-y-3 text-xs">
            <p class="font-bold text-amber-400 text-center flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-star"></i>
                <span>Avalie sua Experiência</span>
            </p>

            <!-- Atendimento -->
            <div class="space-y-1">
                <div class="flex justify-between">
                    <span class="text-slate-300">Atendimento:</span>
                    <span class="text-amber-400 font-bold" x-text="`${ratingService} / 5`"></span>
                </div>
                <div class="flex justify-center space-x-1.5">
                    <template x-for="star in [1,2,3,4,5]" :key="'srv-'+star">
                        <button @click="ratingService = star" class="text-lg focus:outline-none transition-transform hover:scale-125">
                            <i class="fa-star" :class="star <= ratingService ? 'fa-solid text-amber-400' : 'fa-regular text-slate-600'"></i>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Alimento -->
            <div class="space-y-1 pt-2 border-t border-slate-800">
                <div class="flex justify-between">
                    <span class="text-slate-300">Qualidade do Alimento:</span>
                    <span class="text-amber-400 font-bold" x-text="`${ratingFood} / 5`"></span>
                </div>
                <div class="flex justify-center space-x-1.5">
                    <template x-for="star in [1,2,3,4,5]" :key="'food-'+star">
                        <button @click="ratingFood = star" class="text-lg focus:outline-none transition-transform hover:scale-125">
                            <i class="fa-star" :class="star <= ratingFood ? 'fa-solid text-amber-400' : 'fa-regular text-slate-600'"></i>
                        </button>
                    </template>
                </div>
            </div>

            <div class="pt-1">
                <input type="text" x-model="feedbackComment" placeholder="Deixe seu comentário ou sugestão..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>

            <button @click="submitFeedback()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-xl font-bold transition-all shadow">
                Enviar Avaliação
            </button>
        </div>

        <!-- Instagram -->
        <div class="bg-gradient-to-r from-pink-600/20 via-purple-600/20 to-indigo-600/20 p-3 rounded-xl border border-pink-500/30 text-center space-y-1.5">
            <p class="text-xs font-bold text-white flex items-center justify-center space-x-1.5">
                <i class="fa-brands fa-instagram text-pink-400 text-sm"></i>
                <span>Siga-nos no Instagram</span>
            </p>
            <a href="https://www.instagram.com/compreagoranovidades/" target="_blank" class="inline-flex items-center space-x-1.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow hover:opacity-90 transition-all">
                <i class="fa-brands fa-instagram"></i>
                <span>@compreagoranovidades</span>
            </a>
        </div>
    </div>

    <script>
        function clienteApp() {
            return {
                tableNumber: 1,
                clientName: 'Carregando...',
                satTime: '00:00',
                total: 0,
                items: [],
                ratingService: 5,
                ratingFood: 5,
                feedbackComment: '',
                
                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const mesaParam = urlParams.get('mesa');
                    if(mesaParam) {
                        this.tableNumber = parseInt(mesaParam);
                    }

                    // Se houver parâmetros passados diretamente na URL (fallback imediato)
                    if(urlParams.get('cliente')) this.clientName = decodeURIComponent(urlParams.get('cliente'));
                    if(urlParams.get('tempo')) this.satTime = decodeURIComponent(urlParams.get('tempo'));
                    if(urlParams.get('total')) this.total = parseFloat(urlParams.get('total')) || 0;
                    if(urlParams.get('itens')) {
                        try { this.items = JSON.parse(decodeURIComponent(urlParams.get('itens'))); } catch(e){}
                    }

                    // Buscar dados em tempo real do Firebase
                    await this.fetchTableData();
                    setInterval(() => this.fetchTableData(), 3000);
                },

                async fetchTableData() {
                    try {
                        const res = await fetch('https://smartcomanda-df58e-default-rtdb.firebaseio.com/tables.json');
                        if(res.ok) {
                            const data = await res.json();
                            if(data) {
                                let tableFound = null;
                                if(Array.isArray(data)) {
                                    tableFound = data.find(t => t && t.number === this.tableNumber);
                                } else {
                                    Object.keys(data).forEach(k => {
                                        if(data[k] && data[k].number === this.tableNumber) {
                                            tableFound = data[k];
                                        }
                                    });
                                }

                                if(tableFound && tableFound.status === 'ocupada') {
                                    this.clientName = tableFound.client || 'Mesa Ocupada';
                                    let totalSec = tableFound.satSeconds || 0;
                                    let m = Math.floor(totalSec / 60);
                                    let s = totalSec % 60;
                                    this.satTime = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                                    this.total = tableFound.total || 0;
                                    this.items = tableFound.items || [];
                                }
                            }
                        }
                    } catch(e) {}
                },

                async submitFeedback() {
                    const fb = {
                        id: Date.now(),
                        table: this.tableNumber,
                        client: this.clientName || 'Cliente',
                        service: this.ratingService,
                        food: this.ratingFood,
                        total: this.total,
                        items: this.items,
                        comment: this.feedbackComment || 'Sem comentários',
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    };

                    try {
                        await fetch('https://smartcomanda-df58e-default-rtdb.firebaseio.com/feedbacks.json', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(fb)
                        });
                        alert('Avaliação enviada com sucesso! Muito obrigado pela preferência.');
                        this.feedbackComment = '';
                    } catch(e) {
                        alert('Erro ao enviar avaliação. Verifique sua conexão.');
                    }
                }
            }
        }
    </script>
</body>
</html>
