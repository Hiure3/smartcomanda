<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda Digital do Cliente - SmartComanda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4" x-data="clientApp()" x-init="init()">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-6">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2 border-b border-slate-700 pb-4">
            <div class="bg-emerald-500 text-slate-950 w-12 h-12 rounded-2xl font-bold text-2xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">SmartComanda • Mesa <span x-text="tableNumber"></span></h1>
            <p class="text-xs text-emerald-400 font-semibold" x-text="clientName ? 'Cliente: ' + clientName : 'Comanda Digital Ativa'"></p>
        </div>

        <!-- QR Code Fixo da Mesa (Visível no Windows / Navegador) -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col items-center text-center space-y-3">
            <span class="text-xs font-bold text-slate-300">QR Code Fixo desta Mesa (Escaneie ou Visualize):</span>
            <div class="bg-white p-3 rounded-xl shadow-lg border-2 border-emerald-500">
                <img :src="qrImageUrl" alt="QR Code Mesa" class="w-36 h-36 object-contain">
            </div>
            <span class="text-[11px] text-slate-400">Este QR Code é permanente. Aponta sempre para a Mesa <strong x-text="tableNumber"></strong>.</span>
        </div>

        <!-- Indicador de Tempo e Valores -->
        <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
                <span class="text-slate-400 block uppercase font-bold text-[10px]">Tempo na Mesa</span>
                <span class="text-indigo-400 font-bold text-lg font-mono mt-0.5 block" x-text="elapsedTime"></span>
            </div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 text-center">
                <span class="text-slate-400 block uppercase font-bold text-[10px]">Total Consumido</span>
                <span class="text-emerald-400 font-bold text-lg mt-0.5 block" x-text="'R$ ' + total.toFixed(2)"></span>
            </div>
        </div>

        <!-- Lista de Itens Consumidos -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
            <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center space-x-1">
                <i class="fa-solid fa-receipt"></i>
                <span>Itens Adicionados à Comanda:</span>
            </h3>
            <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <template x-if="items.length === 0">
                    <p class="text-xs text-slate-500 text-center py-4">Nenhum item consumido no momento.</p>
                </template>
                <template x-for="item in items" :key="item.id || item.name">
                    <div class="flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded-lg border border-slate-800">
                        <div>
                            <span class="font-bold text-white" x-text="item.qty + 'x ' + item.name"></span>
                            <span class="text-slate-400 block text-[10px]" x-text="'Status: ' + item.status"></span>
                        </div>
                        <span class="font-bold text-emerald-400" x-text="'R$ ' + (item.qty * item.price).toFixed(2)"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Seção de Avaliação & Feedback -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-4 text-xs">
            <h3 class="font-bold text-amber-400 text-center flex items-center justify-center space-x-1">
                <i class="fa-solid fa-star"></i>
                <span>Avalie sua Experiência</span>
            </h3>

            <!-- Atendimento -->
            <div class="space-y-1">
                <div class="flex justify-between font-semibold">
                    <span>Atendimento:</span>
                    <span class="text-amber-400 font-bold" x-text="ratingService + ' / 5'"></span>
                </div>
                <div class="flex justify-center space-x-2">
                    <template x-for="s in [1,2,3,4,5]" :key="'srv-'+s">
                        <button @click="ratingService = s" class="text-xl focus:outline-none transition-transform hover:scale-125">
                            <i class="fa-star" :class="s <= ratingService ? 'fa-solid text-amber-400' : 'fa-regular text-slate-600'"></i>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Alimento -->
            <div class="space-y-1 pt-2 border-t border-slate-800">
                <div class="flex justify-between font-semibold">
                    <span>Qualidade do Alimento:</span>
                    <span class="text-amber-400 font-bold" x-text="ratingFood + ' / 5'"></span>
                </div>
                <div class="flex justify-center space-x-2">
                    <template x-for="f in [1,2,3,4,5]" :key="'fld-'+f">
                        <button @click="ratingFood = f" class="text-xl focus:outline-none transition-transform hover:scale-125">
                            <i class="fa-star" :class="f <= ratingFood ? 'fa-solid text-amber-400' : 'fa-regular text-slate-600'"></i>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Comentário -->
            <div class="pt-2 border-t border-slate-800">
                <input type="text" x-model="comment" placeholder="Deixe seu comentário ou sugestão..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>

            <button @click="submitFeedback()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold shadow-lg transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Enviar Avaliação & Feedback</span>
            </button>
        </div>

        <div class="text-center text-[10px] text-slate-500">
            <p>SmartComanda • QR Code Fixo por Mesa</p>
        </div>
    </div>

    <script>
        function clientApp() {
            return {
                tableNumber: 1,
                clientName: 'Cliente',
                elapsedTime: '00:00',
                total: 0.00,
                items: [],
                ratingService: 5,
                ratingFood: 5,
                comment: '',
                qrImageUrl: '',

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const mesaParam = urlParams.get('mesa');
                    if(mesaParam) this.tableNumber = parseInt(mesaParam);

                    const clienteParam = urlParams.get('cliente');
                    if(clienteParam) this.clientName = decodeURIComponent(clienteParam);

                    // Gerar URL do QR Code fixo da mesa atual para exibição imediata
                    const currentUrl = window.location.href;
                    this.qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=` + encodeURIComponent(currentUrl);

                    // Sincronizar dados da mesa do localStorage ou Firebase
                    this.loadTableData();
                    setInterval(() => this.loadTableData(), 3000);
                },

                loadTableData() {
                    try {
                        const savedTables = localStorage.getItem('smartcomanda_tables_v8');
                        if(savedTables) {
                            const tables = JSON.parse(savedTables);
                            const t = tables.find(x => x.number === this.tableNumber);
                            if(t) {
                                if(t.client) this.clientName = t.client;
                                if(t.total !== undefined) this.total = t.total;
                                if(t.items) this.items = t.items;
                                if(t.satSeconds !== null && t.satSeconds !== undefined) {
                                    const m = Math.floor(t.satSeconds / 60);
                                    const s = t.satSeconds % 60;
                                    this.elapsedTime = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                                }
                            }
                        }
                    } catch(e) {}
                },

                async submitFeedback() {
                    const feedback = {
                        id: Date.now(),
                        table: this.tableNumber,
                        client: this.clientName || 'Cliente',
                        service: this.ratingService,
                        food: this.ratingFood,
                        comment: this.comment || 'Sem comentários',
                        total: this.total,
                        items: this.items,
                        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    };

                    try {
                        await fetch('https://smartcomanda-df58e-default-rtdb.firebaseio.com/feedbacks.json', {
                            method: 'POST',
                            body: JSON.stringify(feedback)
                        });
                    } catch(e) {}

                    // Salvar também no localStorage local
                    try {
                        let localFb = JSON.parse(localStorage.getItem('smartcomanda_feedbacks_v8') || '[]');
                        localFb.unshift(feedback);
                        localStorage.setItem('smartcomanda_feedbacks_v8', JSON.stringify(localFb));
                    } catch(e) {}

                    alert('Obrigado! Sua avaliação foi enviada com sucesso.');
                    this.comment = '';
                }
            }
        }
    </script>
</body>
</html>
