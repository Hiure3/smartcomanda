<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SmartComanda ULTIMATE 6.0 - Dashboard Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background-color: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #30363d; color: #58a6ff; }
        .table-list { overflow-y: auto; flex: 1; padding: 10px; }
        .table-item { background: #21262d; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 1px solid #30363d; transition: 0.2s; }
        .table-item:hover { background: #30363d; border-color: #58a6ff; }
        .table-item.active { border-color: #58a6ff; background: #1f6feb33; }
        .table-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .table-status { font-size: 12px; color: #3fb950; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #0d1117; }
        .chat-header { padding: 20px; background-color: #161b22; border-bottom: 1px solid #30363d; font-size: 16px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 60%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .message.client { background: #21262d; align-self: flex-start; border: 1px solid #30363d; }
        .message.admin { background: #1f6feb; color: white; align-self: flex-end; }
        .chat-input-area { padding: 15px 20px; background-color: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; color: white; font-size: 14px; outline: none; }
        .chat-input-area input:focus { border-color: #58a6ff; }
        .chat-input-area button { background: #238636; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .chat-input-area button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">💬 Mesas Atendidas (Chat)</div>
        <div class="table-list" id="tableList">
            <!-- Gerado via JS -->
        </div>
    </div>
    <div class="chat-container">
        <div class="chat-header" id="chatHeader">Selecione uma mesa para iniciar o atendimento</div>
        <div class="chat-messages" id="chatMessages">
            <!-- Mensagens do chat -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Digite sua resposta para o cliente..." onkeypress="checkSend(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        let currentTable = null;
        const chatsData = {
            1: { name: "Mesa 1 - Marcio", messages: [{ sender: 'client', text: 'Olá, poderiam trazer mais um copo gelado por favor?' }, { sender: 'admin', text: 'Claro, Marcio! Estamos levando agora mesmo.' }] },
            2: { name: "Mesa 2 - Camila", messages: [{ sender: 'client', text: 'Boa noite, qual o tempo estimado para o prato principal?' }] },
            3: { name: "Mesa 3 - Visitante", messages: [] },
            4: { name: "Mesa 4 - Livre", messages: [] }
        };

        function renderTables() {
            const list = document.getElementById('tableList');
            list.innerHTML = '';
            for (let id in chatsData) {
                const div = document.createElement('div');
                div.className = `table-item ${currentTable == id ? 'active' : ''}`;
                div.onclick = () => selectTable(id);
                div.innerHTML = `<div class="table-title">${chatsData[id].name}</div><div class="table-status">● Ativo em tempo real</div>`;
                list.appendChild(div);
            }
        }

        function selectTable(id) {
            currentTable = id;
            document.getElementById('chatHeader').innerText = `Chat ao vivo: ${chatsData[id].name}`;
            renderTables();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            if (!currentTable || !chatsData[currentTable]) return;
            chatsData[currentTable].messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender}`;
                div.innerText = msg.text;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentTable) return;
            
            chatsData[currentTable].messages.push({ sender: 'admin', text: text });
            input.value = '';
            renderMessages();
            
            // Simulação de sincronização automática com o celular do cliente
            localStorage.setItem('smartcomanda_chat_sync', JSON.stringify(chatsData));
        }

        function checkSend(e) {
            if (e.key === 'Enter') sendMessage();
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'smartcomanda_chat_sync') {
                const updated = JSON.parse(e.newValue);
                Object.assign(chatsData, updated);
                renderMessages();
            }
        });

        renderTables();
    </script>
</body>
</html>
